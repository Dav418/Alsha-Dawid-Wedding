name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/davboxhome/alsha-dawid-wedding

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web preparation dependencies
        run: python -m pip install Pillow

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare Flutter web files
        run: python scripts/prepare_web.py

      - name: Build Flutter web
        run: >
          flutter build web
          --release
          --base-href '/'
          --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Verify web build
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/favicon.png

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stack directory
        run: |
          sudo mkdir -p /opt/stacks/alisha-dawid-wedding
          sudo chown "$USER:$USER" /opt/stacks/alisha-dawid-wedding

      - name: Copy compose file
        run: |
          cp deploy/docker-compose.yml /opt/stacks/alisha-dawid-wedding/docker-compose.yml

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull latest image
        working-directory: /opt/stacks/alisha-dawid-wedding
        run: docker compose pull

      - name: Deploy
        working-directory: /opt/stacks/alisha-dawid-wedding
        run: docker compose up -d --remove-orphans

      - name: Verify deployment
        run: |
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8083/ > /dev/null

      - name: Show status
        working-directory: /opt/stacks/alisha-dawid-wedding
        run: docker compose ps